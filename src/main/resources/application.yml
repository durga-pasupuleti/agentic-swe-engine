server:
  port: 8080

sdlc:
  prompts:
    storage: ${SDLC_PROMPT_STORAGE:classpath}
    database:
      url: ${SDLC_PROMPT_DATABASE_URL:jdbc:postgresql://localhost:5433/agentic_prompts}
      username: ${SDLC_PROMPT_DATABASE_USERNAME:sdlc_prompts}
      password: ${SDLC_PROMPT_DATABASE_PASSWORD:local-development-only}
  audit:
    log-file: ${SDLC_AUDIT_LOG_FILE:./data/audit-events.jsonl}
  ollama:
    models:
      code: ${SDLC_OLLAMA_MODEL_CODE:qwen2.5-coder:7b}
      fast: ${SDLC_OLLAMA_MODEL_FAST:llama3.2}

spring:
  ai:
    ollama:
      base-url: ${SDLC_OLLAMA_BASE_URL:http://sdlc-ollama-engine:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${SDLC_OLLAMA_MODEL_CODE:qwen2.5-coder:7b}
          temperature: 0.2
    mcp:
      client:
        enabled: ${SDLC_GITHUB_MCP_ENABLED:true}
        name: agentic-swe-engine
        version: 1.0.0
        type: SYNC
        request-timeout: 180s
        toolcallback:
          enabled: false
        stdio:
          connections:
            github:
              command: ${SDLC_DOCKER_COMMAND:docker}
              args:
                - run
                - -i
                - --rm
                - -e
                - GITHUB_PERSONAL_ACCESS_TOKEN
                - -e
                - GITHUB_HOST
                - -e
                - GITHUB_TOOLSETS
                - ghcr.io/github/github-mcp-server:v1.13.0
              env:
                GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:}
                GITHUB_HOST: ${SDLC_GITHUB_HOST:https://github.com}
                GITHUB_TOOLSETS: repos,git,actions,pull_requests

logging:
  level:
    com.swe.sdlc: DEBUG
    org.springframework.web: INFO