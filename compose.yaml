services:
  sdlc-prompts-db:
    image: postgres:17-alpine
    container_name: sdlc-prompts-db
    environment:
      POSTGRES_DB: agentic_prompts
      POSTGRES_USER: sdlc_prompts
      POSTGRES_PASSWORD: ${SDLC_PROMPT_DATABASE_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - prompt-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc_prompts -d agentic_prompts"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sdlc-ollama-engine:
    image: ollama/ollama:latest
    container_name: sdlc-ollama-engine
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
  prompt-data: